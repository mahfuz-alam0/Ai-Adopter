<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>AI Hub</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6fb; --panel: #fff; --line: #e3e3ee; --text: #17162b; --muted: #6b6a84; --accent: #5b4de0;
        --claude: #e07a5f; --chatgpt: #10a37f; --gemini: #5b8def; --bad: #d63b4a; --good: #10a37f;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f0e1f; --panel: #17162b; --line: #2a2945; --text: #ecebfa; --muted: #8f8eab; --accent: #8b7bff; --bad: #ff6b78; --good: #3ccfa5 }
      }
      * { box-sizing: border-box }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text) }
      header { display: flex; align-items: center; gap: 10px; padding: 10px 16px }
      header img { width: 28px; height: 28px }
      header b { font-size: 15px; letter-spacing: .2px }
      header span { color: var(--muted); font-size: 12px }
      #chip { padding: 0 16px 8px; min-height: 34px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px }
      #chip b { color: var(--accent) }
      #panes { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px; min-height: 0 }
      section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
      h2 { margin: 0; padding: 10px 14px; font-size: 13px; text-transform: capitalize; display: flex; align-items: center; border-bottom: 1px solid var(--line) }
      h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 8px }
      section[data-p=claude] { --c: var(--claude) } section[data-p=chatgpt] { --c: var(--chatgpt) } section[data-p=gemini] { --c: var(--gemini) }
      .badge { margin-left: auto; font-size: 11px; font-weight: normal; color: var(--muted); cursor: default; text-transform: none }
      .badge.ready { color: var(--good) }
      .badge.busy { color: var(--accent) }
      .badge.needs-user { color: var(--bad); cursor: pointer }
      pre { flex: 1; margin: 0; padding: 12px 14px; overflow: auto; white-space: pre-wrap; font: inherit }
      form { display: flex; gap: 8px; padding: 12px 16px }
      textarea { flex: 1; resize: none; font: inherit; padding: 8px 10px; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
      textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px }
      button { font: inherit; padding: 6px 12px; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer }
      button:hover { border-color: var(--accent) }
      button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff }
    </style>
  </head>
  <body>
    <header><img src="/logo.svg" alt="" /><b>AI Hub</b><span>Claude · ChatGPT · Gemini</span></header>
    <div id="chip"></div>
    <main id="panes"></main>
    <form id="form">
      <textarea id="prompt" rows="3" placeholder="Ask anything. Prefix @claude, @chatgpt or @gemini to force a provider. Enter sends."></textarea>
      <button type="submit">Send</button>
      <button type="button" id="compare">Compare all</button>
      <button type="button" id="new">New thread</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
